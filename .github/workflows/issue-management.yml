name: Issue Management

on:
  issues:
    types: [opened]
  schedule:
    - cron: '0 0 * * *'

jobs:
  welcome:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            👋 **Welcome and thanks for opening your first issue!**
            
            We appreciate you taking the time to contribute or report a problem. Someone will review this as soon as possible. In the meantime, please make sure you've included all relevant details (like logs, steps to reproduce, or environment info).

  stale:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            ⏳ **This issue has been marked as stale** because it has been inactive for 30 days. 
            
            It will automatically close in **7 days** if no further activity occurs. If this is still relevant, please leave a comment or update!
          close-issue-message: |
            🔒 **Closed due to inactivity.** 
            
            This issue was automatically closed because it remained inactive. Feel free to open a new issue if you need further assistance.
          days-before-pr-stale: -1
          days-before-pr-close: -1
