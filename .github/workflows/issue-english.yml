name: Ensure issues are posted in English
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  translate-to-english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install --quiet langdetect
      - name: Translate non-English issue to English
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, time

          token = os.environ['GITHUB_TOKEN']
          repo = os.environ['REPO']
          num = os.environ['ISSUE_NUMBER']
          author = os.environ['AUTHOR']

          def api(method, path, data=None):
              url = 'https://api.github.com' + path
              req = urllib.request.Request(url, method=method)
              req.add_header('Authorization', 'Bearer ' + token)
              req.add_header('Accept', 'application/vnd.github+json')
              req.add_header('X-GitHub-Api-Version', '2022-11-28')
              if data is not None:
                  body = json.dumps(data).encode()
                  req.add_header('Content-Type', 'application/json')
                  req.data = body
              with urllib.request.urlopen(req) as resp:
                  raw = resp.read()
                  return resp.status, (json.loads(raw) if raw else {})

          try:
              status, issue = api('GET', f'/repos/{repo}/issues/{num}')
          except Exception as e:
              print('Failed to fetch issue:', e)
              raise SystemExit(0)

          title = issue.get('title') or ''
          body = issue.get('body') or ''

          from langdetect import detect, LangDetectException
          def is_english(text):
              text = text.strip()
              if not text:
                  return True
              try:
                  return detect(text) == 'en'
              except LangDetectException:
                  return True

          combined = (title + ' ' + body).strip()
          if is_english(combined):
              print('Already English, skipping.')
              raise SystemExit(0)

          # detect source language for translation
          try:
              src = detect(combined)
          except LangDetectException:
              src = 'auto'
          if src == 'en':
              src = 'auto'

          def translate_text(text, src):
              if not text.strip():
                  return text
              # chunk into <=400 char pieces
              chunks = []
              cur = ''
              for line in text.split('\n'):
                  if len(cur) + len(line) + 1 <= 400:
                      cur += (line + '\n')
                  else:
                      if cur:
                          chunks.append(cur)
                      if len(line) > 400:
                          for i in range(0, len(line), 400):
                              chunks.append(line[i:i+400] + '\n')
                          cur = ''
                      else:
                          cur = line + '\n'
              if cur.strip():
                  chunks.append(cur)

              out = []
              for c in chunks:
                  q = urllib.parse.quote(c)
                  url = f'https://api.mymemory.translated.net/get?q={q}&langpair={src}|en'
                  translated = c
                  for attempt in range(3):
                      try:
                          req = urllib.request.Request(url)
                          with urllib.request.urlopen(req, timeout=30) as resp:
                              data = json.loads(resp.read())
                          t = data.get('responseData', {}).get('translatedText')
                          if t:
                              translated = t
                          break
                      except Exception as e:
                          print('chunk translate error:', e)
                          if attempt < 2:
                              time.sleep(2)
                  out.append(translated)
                  time.sleep(0.5)
              return ''.join(out)

          try:
              new_title = translate_text(title, src) if title.strip() else title
              new_body = translate_text(body, src) if body.strip() else body
          except Exception as e:
              print('Translation failed:', e)
              raise SystemExit(0)

          if new_title.strip() == title.strip() and new_body.strip() == body.strip():
              print('No change after translation, skipping.')
              raise SystemExit(0)

          try:
              api('PATCH', f'/repos/{repo}/issues/{num}', {'title': new_title, 'body': new_body})
              print('Issue updated to English.')
          except Exception as e:
              print('Failed to update issue:', e)
              raise SystemExit(0)

          try:
              comment = '@' + author + ' This issue was not posted in English. It has been translated to English automatically. Please post in English only next time on any of my repositories.'
              api('POST', f'/repos/{repo}/issues/{num}/comments', {'body': comment})
              print('Comment posted.')
          except Exception as e:
              print('Failed to post comment:', e)
          PY
