name: Discord Notify

on:
  issues:
    types: [opened, closed, reopened]
  release:
    types: [published]
  push:
    branches: ['**']
    tags-ignore: ['**']
  workflow_dispatch:

permissions:
  contents: read
  issues: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_WEBHOOK_ISSUES: ${{ secrets.DISCORD_WEBHOOK_ISSUES }}
      DISCORD_WEBHOOK_SUGGESTIONS: ${{ secrets.DISCORD_WEBHOOK_SUGGESTIONS }}
      DISCORD_WEBHOOK_ANNOUNCEMENTS: ${{ secrets.DISCORD_WEBHOOK_ANNOUNCEMENTS }}
      DISCORD_WEBHOOK_UPDATES: ${{ secrets.DISCORD_WEBHOOK_UPDATES }}
    steps:
      - name: Post event to Discord
        shell: python
        run: |
          import json, os, urllib.request

          def post(url, payload):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(payload).encode(),
                  headers={
                      "Content-Type": "application/json",
                      "User-Agent": "NigelDiscordNotify/1.0 (+https://github.com/Nigel1992)",
                  },
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.status

          def field(name, value, inline=False):
              return {"name": name, "value": (value or "-")[:1000], "inline": inline}

          event = os.environ.get("GITHUB_EVENT_NAME")
          repo = os.environ["GITHUB_REPOSITORY"]
          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              data = json.load(f)

          if event == "issues":
              issue = data["issue"]
              action = data["action"]
              labels = [l["name"] for l in issue.get("labels", [])]
              label_text = " ".join(labels).lower()
              suggestions = "feature" in label_text or "enhancement" in label_text
              url = os.environ["DISCORD_WEBHOOK_SUGGESTIONS"] if suggestions else os.environ["DISCORD_WEBHOOK_ISSUES"]
              color = {"opened": 0x3498DB, "closed": 0x57F287, "reopened": 0xE67E22}.get(action, 0x95A5A6)
              payload = {"embeds": [{
                  "title": f"[{action.upper()}] #{issue['number']} {issue['title']}",
                  "url": issue["html_url"],
                  "color": color,
                  "description": (issue.get("body") or "")[:1500],
                  "fields": [
                      field("Author", issue["user"]["login"], True),
                      field("Labels", ", ".join(labels) or "none", True),
                  ],
                  "footer": {"text": repo},
              }]}

          elif event == "release":
              rel = data["release"]
              url = os.environ["DISCORD_WEBHOOK_ANNOUNCEMENTS"]
              payload = {"embeds": [{
                  "title": f"Release {rel['tag_name']}",
                  "url": rel["html_url"],
                  "color": 0x9B59B6,
                  "description": (rel.get("body") or "")[:1500],
                  "footer": {"text": repo},
              }]}

          elif event == "push":
              commits = data.get("commits", [])
              branch = data.get("ref", "").replace("refs/heads/", "")
              pusher = data.get("pusher", {}).get("name", "unknown")
              lines = []
              for c in commits[:10]:
                  msg = c.get("message", "").splitlines()[0][:100]
                  lines.append(f"`{c['id'][:7]}` {msg} — {c.get('author', {}).get('name', '?')}")
              if len(commits) > 10:
                  lines.append(f"…and {len(commits) - 10} more")
              url = os.environ["DISCORD_WEBHOOK_UPDATES"]
              payload = {"embeds": [{
                  "title": f"{len(commits)} new commit(s) to {branch}",
                  "url": data.get("compare", ""),
                  "color": 0x2ECC71,
                  "description": "\n".join(lines)[:1500] or "(no commit details)",
                  "fields": [field("Pushed by", pusher, True)],
                  "footer": {"text": repo},
              }]}

          else:
              print("No Discord mapping for event:", event)
              raise SystemExit(0)

          if not url:
              print("Discord webhook secret missing; skipping")
              raise SystemExit(0)
          print("Discord response:", post(url, payload))
